{% extends 'base.html' %}

{% block title %}Eliminar Curso | JP University{% endblock %}
{% block page_title %}Eliminar Curso{% endblock %}

{% block content %}
<style>
    .confirmacion {
        max-width: 600px;
        margin: 0 auto;
        text-align: center;
    }

    .acciones {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 20px;
    }

    .btn {
        display: inline-block;
        padding: 8px 14px;
        text-decoration: none;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }

    .btn-eliminar {
        background-color: #dc3545;
        color: white;
    }

    .btn-cancelar {
        background-color: #6c757d;
        color: white;
    }
</style>

<div class="card shadow-sm confirmacion">
    <div class="card-body">
        <h5 class="card-title mb-3">¿Eliminar curso?</h5>
        <p>Vas a eliminar <strong>{{ curso.nombre }}</strong>.</p>

        <form method="post">
            {% csrf_token %}
            <div class="acciones">
                <button type="submit" class="btn btn-eliminar">Sí, eliminar</button>
                <a href="{% url 'core:cursos' %}" class="btn btn-cancelar">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
